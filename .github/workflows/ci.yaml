name: CI
on:
  push:
    branches-ignore: [site-src, gh-pages]
  pull_request:
    branches-ignore: [site-src, gh-pages]
  workflow_dispatch:
jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Bootstrap, self-build and test
        shell: pwsh
        run: ./bootstrap.ps1 -Test
      - name: Upload Bari distribution
        uses: actions/upload-artifact@v7
        with:
          name: bari-net10
          path: target/full/
