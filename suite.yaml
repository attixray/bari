---
suite:      bari
version:    $GIT_TAG.$GIT_REVNO
contracts:  disabled
copyright: Copyright © Daniel Vigovszky, 2012

csharp:
    target-framework: v10.0
    self-contained: false

nuget:
    package-reference: true

msbuild:
    when bootstrap:
        version: Default
    when not bootstrap:
        version: Dotnet
    restore: true

test:
  enabled-runners:
    - dotnet

goals:
    - name: debug
    - name: release
    - name: bootstrap
      incorporates:
          - release

fs-repositories:
    - lib/%NAME/%FILENAME.%EXT

aliases:
    yaml:
        - nuget://YamlDotNet/18.1.0
    ninject:
        - nuget://Castle.Core/5.2.1
        - nuget://Ninject.Extensions.Factory/3.3.3
        - nuget://Ninject/3.3.6
    testing:
        - nuget://FluentAssertions/7.2.0
        - nuget://Moq/4.20.72
        - nuget://NUnit/4.6.1
        - nuget://NUnit3TestAdapter/6.3.0
        - nuget://Microsoft.NET.Test.Sdk/18.10.0
    logging:
        - nuget://log4net/3.4.0

modules:
    - name: core
      projects:
        - name: Bari.Core
          references:
            - alias://ninject
            - alias://logging
            - alias://yaml
            - nuget://QuikGraph/2.5.0
          csharp:
            defines:
                - when debug:
                  - DEBUG

        - name: bari
          type: executable
          references:
            - alias://logging
            - alias://ninject
            - nuget://QuikGraph/2.5.0
            - module://Bari.Core
          csharp:
            root-namespace: Bari.Console
      tests:
        - name: Bari.Core.Test
          references:
            - alias://ninject
            - alias://testing
            - alias://yaml
            - module://Bari.Core
        - name: bari.Test
          references:
            - alias://logging
            - alias://ninject
            - alias://testing
            - module://Bari.Core
            - module://bari
          csharp:
            root-namespace: Bari.Console.Test
    - name: dotnetplugins
      projects:
        - name: Bari.Plugins.VsCore
          references:
            - alias://logging
            - alias://ninject
            - alias://yaml
            - nuget://QuikGraph/2.5.0
            - nuget://Microsoft.VisualStudio.Setup.Configuration.Interop/3.14.2075
            - suite://core/Bari.Core
        - name: Bari.Plugins.Csharp
          references:
            - alias://logging
            - alias://ninject
            - alias://yaml
            - module://Bari.Plugins.VsCore
            - suite://core/Bari.Core
        - name: Bari.Plugins.Fsharp
          references:
            - alias://logging
            - alias://ninject
            - alias://yaml
            - suite://core/Bari.Core
            - module://Bari.Plugins.VsCore
        - name: Bari.Plugins.VCpp
          references:
            - alias://logging
            - alias://ninject
            - alias://yaml
            - suite://core/Bari.Core
            - module://Bari.Plugins.VsCore
        - name: Bari.Plugins.Nuget
          references:
            - alias://logging
            - alias://ninject
            - alias://yaml
            - suite://core/Bari.Core
            - module://Bari.Plugins.VsCore
            - module://Bari.Plugins.Csharp
        - name: Bari.Plugins.FSRepository
          references:
            - alias://logging
            - alias://ninject
            - alias://yaml
            - suite://core/Bari.Core
        - name: Bari.Plugins.Gallio
          references:
            - alias://logging
            - alias://ninject
            - suite://core/Bari.Core
            - suite://dotnetplugins/Bari.Plugins.Nuget
        - name: Bari.Plugins.NUnit
          references:
            - alias://logging
            - alias://ninject
            - suite://core/Bari.Core
            - suite://dotnetplugins/Bari.Plugins.Nuget
        - name: Bari.Plugins.dotnet
          references:
            - alias://logging
            - alias://ninject
            - suite://core/Bari.Core
        - name: Bari.Plugins.CodeContracts
          references:
            - alias://logging
            - alias://ninject
            - alias://yaml
            - suite://core/Bari.Core
            - module://Bari.Plugins.Csharp
            - module://Bari.Plugins.VsCore
      tests:
        - name: Bari.Plugins.Csharp.Test
          references:
            - alias://testing
            - alias://ninject
            - alias://yaml
            - suite://core/Bari.Core
            - suite://core/Bari.Core.Test
            - module://Bari.Plugins.Csharp
            - module://Bari.Plugins.VsCore
        - name: Bari.Plugins.VCpp.Test
          references:
            - alias://testing
            - alias://ninject
            - alias://yaml
            - suite://core/Bari.Core
            - suite://core/Bari.Core.Test
            - module://Bari.Plugins.VCpp
            - module://Bari.Plugins.VsCore
        - name: Bari.Plugins.FSRepository.Test
          references:
            - alias://testing
            - alias://ninject
            - alias://yaml
            - suite://core/Bari.Core
            - suite://core/Bari.Core.Test
            - module://Bari.Plugins.FSRepository
    - name: scripting
      projects:
        - name: Bari.Plugins.PythonScripts
          references:
            - nuget://IronPython/3.4.2
            - nuget://DynamicLanguageRuntime/1.3.5
            - nuget://System.Drawing.Common/10.0.11
            - nuget://IronPython.StdLib/3.4.2
            - alias://logging
            - alias://ninject
            - suite://core/Bari.Core
      tests:
        - name: Bari.Plugins.PythonScripts.Test
          references:
            - alias://testing
            - alias://ninject
            - alias://yaml
            - suite://core/Bari.Core
            - suite://core/Bari.Core.Test
            - module://Bari.Plugins.PythonScripts

    - name: addon
      projects:
        - name: Bari.Plugins.AddonSupport
          references:
            - alias://logging
            - alias://ninject
            - alias://yaml
            - suite://core/Bari.Core
            - suite://dotnetplugins/Bari.Plugins.VsCore
            - nuget://Newtonsoft.Json/13.0.4
      tests:
        - name: Bari.Plugins.AddonSupport.Test
          references:
            - alias://testing
            - alias://ninject
            - alias://yaml
            - suite://core/Bari.Core
            - suite://core/Bari.Core.Test
            - module://Bari.Plugins.AddonSupport

    - name: innosetup
      projects:
        - name: Bari.Plugins.InnoSetup
          references:
            - alias://logging
            - alias://ninject
            - alias://yaml
            - suite://core/Bari.Core

    - name: vcs
      projects:
        - name: Bari.Plugins.Vcs.Core
          references:
            - alias://logging
            - alias://ninject
            - suite://core/Bari.Core

        - name: Bari.Plugins.Vcs.Hg
          references:
            - alias://logging
            - alias://ninject
            - module://Bari.Plugins.Vcs.Core
            - suite://core/Bari.Core

        - name: Bari.Plugins.Vcs.Git
          references:
            - alias://logging
            - alias://ninject
            - module://Bari.Plugins.Vcs.Core
            - suite://core/Bari.Core

    - name: systests
      projects:
        - name: systests
          type: executable

    - name: tools
      projects:
        - name: Bari.Plugins.Deps
          references:
            - alias://logging
            - nuget://QuikGraph/2.5.0
            - alias://ninject
            - suite://core/Bari.Core

products:
    - name: full
      modules:
          - core
          - dotnetplugins
          - scripting
          - innosetup
          - addon
          - vcs
          - tools
      packager:
        type: nuget
        param:
          id: bari
          description: Bari is an advanced build manager for .NET
          author: Daniel Vigovszky
          project-url: http://github.com/vigoo/bari
          license-url: http://www.apache.org/licenses/LICENSE-2.0
          icon-url: https://raw.githubusercontent.com/vigoo/bari/master/doc/logo.png
          package-as-tool: true
          api-key: $NUGET_API_KEY

    - name: systest
      modules:
          - systests
